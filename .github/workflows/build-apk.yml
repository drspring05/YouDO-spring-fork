name: Build Android APK

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'release-*'
      - 'hotfix/**'
      - 'hotfix-*'
      - 'codex/release-*'
      - 'codex/hotfix-*'
  workflow_dispatch:

jobs:
  build:
    name: Build YouDO Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # This fork signs with its own key, stored in this repository's secrets
      # (YOUDO_SIGNING_KEYSTORE_BASE64 + YOUDO_SIGNING_PASSWORD). Forks do not
      # inherit the original project's key. Without the secrets the build still
      # runs, but with a throwaway debug key: every such build has a different
      # signature, so the previous YouDO must be uninstalled before installing,
      # and the artifact is named to show it is not a permanent build.
      - name: Prepare Android signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.YOUDO_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/youdo-release.p12"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::YOUDO_SIGNING_KEYSTORE_BASE64 is not set. Building with a throwaway debug key; uninstall the previous YouDO before installing this APK."
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear Gradle Caches
        run: |
          rm -rf ~/.gradle
          rm -rf android/build
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:sql

      - name: Build Web Production Assets
        run: |
          npm run build
          npm run verify:build

      - name: Sync Capacitor Assets to Android
        run: npx @capacitor/cli sync android

      - name: Align AGP versions and Java compatibility
        run: |
          sed -i "s/classpath 'com.android.tools.build:gradle:.*/classpath 'com.android.tools.build:gradle:8.13.0'/g" android/build.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:.*/classpath 'com.android.tools.build:gradle:8.13.0'/g" android/capacitor-cordova-android-plugins/build.gradle
          sed -i "s/sourceCompatibility JavaVersion.VERSION_.*/sourceCompatibility JavaVersion.VERSION_21/g" android/app/build.gradle
          sed -i "s/targetCompatibility JavaVersion.VERSION_.*/targetCompatibility JavaVersion.VERSION_21/g" android/app/build.gradle

      - name: Pre-warm Gradle Wrapper
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Xmx6144m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.unsafe.build-cache=false"
          YOUDO_SIGNING_KEYSTORE: ${{ steps.signing.outputs.persistent == 'true' && format('{0}/youdo-release.p12', runner.temp) || '' }}
          YOUDO_SIGNING_PASSWORD: ${{ steps.signing.outputs.persistent == 'true' && secrets.YOUDO_SIGNING_PASSWORD || '' }}
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace -x lint

      - name: Verify APK signature and checksum
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      # The signing certificate's SHA-256 is public. It is printed below so it can
      # be copied into the optional repository variable YOUDO_SIGNING_CERT_SHA256,
      # which then pins every later build to the same key.
      - name: Verify signing and release identity
        env:
          PERSISTENT_KEY: ${{ steps.signing.outputs.persistent }}
          PINNED_CERT_SHA256: ${{ vars.YOUDO_SIGNING_CERT_SHA256 }}
        run: |
          CURRENT_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          CURRENT_CERT="$("$APKSIGNER" verify --print-certs "$CURRENT_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          CURRENT_CODE="$("$AAPT" dump badging "$CURRENT_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          CURRENT_NAME="$("$AAPT" dump badging "$CURRENT_APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          PACKAGE_NAME="$(node -p "require('./package.json').version")"
          APP_NAME="$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" src/lib/version.ts | head -n 1)"
          echo "Signing certificate SHA-256: $CURRENT_CERT"
          if [ "$PERSISTENT_KEY" = "true" ] && [ -n "$PINNED_CERT_SHA256" ]; then
                     test "${CURRENT_CERT,,}" = "${PINNED_CERT_SHA256,,}"
          fi
          EXPECTED_CODE="$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)"
          EXPECTED_NAME="$(sed -n 's/.*versionName \"\([^\"]*\)\".*/\1/p' android/app/build.gradle | head -n 1)"
          test "$EXPECTED_CODE" -ge 1
          test "$CURRENT_CODE" = "$EXPECTED_CODE"
          test "$CURRENT_NAME" = "$EXPECTED_NAME"
          test "$PACKAGE_NAME" = "$CURRENT_NAME"
          test "$APP_NAME" = "$CURRENT_NAME"
          echo "Release identity verified: versionName $CURRENT_NAME; versionCode $CURRENT_CODE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.persistent == 'true' && 'YouDO-APK' || 'YouDO-APK-throwaway-key' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30 
